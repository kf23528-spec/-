<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3Dラーメン屋シミュレーター</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a0a00; overflow:hidden; font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; touch-action:none; }
#canvas { display:block; width:100vw; height:100vh; }

/* ===== HUD ===== */
#hud { position:fixed; top:0; left:0; width:100%; pointer-events:none; z-index:100; }
#status-bar {
  position:absolute; top:14px; left:14px;
  background:rgba(0,0,0,0.78); border:1.5px solid #f5c842;
  border-radius:12px; padding:10px 18px;
  color:#f5c842; font-size:14px; font-weight:700;
  line-height:1.8; min-width:170px;
  text-shadow:0 1px 4px #000; pointer-events:none;
}
#money-val { color:#7fff7f; font-size:18px; }
#objective {
  position:absolute; top:14px; right:14px;
  background:rgba(0,0,0,0.78); border:1.5px solid #6ad4ff;
  border-radius:12px; padding:10px 16px;
  color:#6ad4ff; font-size:13px; font-weight:600;
  max-width:230px; text-align:right; pointer-events:none;
}
#inventory-bar {
  position:absolute; bottom:148px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.78); border:1.5px solid #aaa;
  border-radius:12px; padding:8px 20px;
  color:#fff; font-size:13px; text-align:center;
  pointer-events:none; white-space:nowrap;
}
#carry-indicator {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:24px; height:24px; pointer-events:none;
}
#carry-indicator::before,#carry-indicator::after {
  content:''; position:absolute; background:rgba(255,255,255,0.85);
}
#carry-indicator::before { width:2px; height:100%; left:50%; top:0; margin-left:-1px; }
#carry-indicator::after  { width:100%; height:2px; top:50%; left:0; margin-top:-1px; }

/* ===== ACTION PROMPT ===== */
#action-prompt {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.88); border:2px solid #f5c842;
  border-radius:20px; padding:10px 26px;
  color:#fff; font-size:15px; font-weight:700;
  text-align:center; pointer-events:none; z-index:101;
  display:none; white-space:nowrap;
}

/* ===== LOADING ===== */
#loading-screen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#1a0a00; z-index:500;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px;
}
#loading-screen h1 { color:#f5c842; font-size:28px; text-align:center; }
#loading-screen p  { color:#aaa; font-size:15px; text-align:center; }
#loading-bar-wrap {
  width:260px; height:12px; background:rgba(255,255,255,0.12);
  border-radius:6px; overflow:hidden;
}
#loading-bar {
  height:100%; background:linear-gradient(90deg,#f5c842,#ff8c00);
  border-radius:6px; width:0%; transition:width .3s;
}

/* ===== PC ORDER MODAL ===== */
#order-modal {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.88); z-index:200;
  align-items:center; justify-content:center;
}
#order-modal.active { display:flex; }
#order-panel {
  background:#1a2636; border:2px solid #4af; border-radius:18px;
  padding:28px 32px; width:min(390px,92vw);
  color:#fff; text-align:center;
}
#order-panel h2 { color:#4af; font-size:20px; margin-bottom:6px; }
#order-panel .subtitle { color:#aaa; font-size:13px; margin-bottom:20px; }
.order-item {
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,0.07); border-radius:10px;
  padding:12px 16px; margin-bottom:10px;
}
.order-item .name { font-size:15px; font-weight:600; }
.order-item .price { color:#f5c842; font-size:14px; margin-top:2px; }
.order-btn {
  background:#2a7fff; color:#fff; border:none; border-radius:8px;
  padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer;
}
.order-btn:active { background:#1555cc; }
#close-order {
  margin-top:16px; background:#555; color:#fff; border:none;
  border-radius:10px; padding:10px 32px; font-size:15px;
  font-weight:700; cursor:pointer; width:100%;
}
#close-order:active { background:#333; }

/* ===== TOAST ===== */
#toast {
  position:fixed; bottom:210px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.88); border:1.5px solid #f5c842;
  border-radius:14px; padding:10px 22px;
  color:#f5c842; font-size:14px; font-weight:700;
  pointer-events:none; z-index:300;
  opacity:0; transition:opacity .3s; white-space:nowrap;
}
#toast.show { opacity:1; }

/* ===== JOYSTICK ===== */
#joystick-zone {
  position:fixed; bottom:18px; left:18px;
  width:140px; height:140px; z-index:110;
}
#joystick-base {
  width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,0.10); border:2px solid rgba(255,255,255,0.32);
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
}
#joystick-thumb {
  width:52px; height:52px; border-radius:50%;
  background:rgba(255,255,255,0.52); border:2px solid rgba(255,255,255,0.82);
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
}

/* ===== ACTION BUTTON ===== */
#action-btn {
  position:fixed; bottom:28px; right:26px;
  width:84px; height:84px; border-radius:50%;
  background:rgba(245,200,66,0.88); border:3px solid #f5c842;
  color:#000; font-size:13px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  z-index:110; cursor:pointer; text-align:center; line-height:1.2;
  user-select:none; -webkit-user-select:none;
  box-shadow:0 4px 18px rgba(245,200,66,.55);
}
#action-btn:active { transform:scale(.92); }

/* ===== SPEECH BUBBLE ===== */
.speech-bubble {
  position:fixed; z-index:150;
  background:#fff; color:#222; font-size:13px; font-weight:700;
  border-radius:12px; padding:8px 14px; white-space:nowrap;
  box-shadow:0 2px 12px rgba(0,0,0,.45); pointer-events:none;
  border:1.5px solid #ccc;
  transform:translateX(-50%) translateY(-100%);
}
.speech-bubble::after {
  content:''; position:absolute; bottom:-8px; left:50%;
  transform:translateX(-50%);
  border:8px solid transparent; border-top-color:#fff; border-bottom:none;
}

/* ===== OVERLAY ===== */
#overlay-msg {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.90); z-index:400;
  align-items:center; justify-content:center; flex-direction:column;
}
#overlay-msg.active { display:flex; }
#overlay-msg h1 { color:#f5c842; font-size:34px; margin-bottom:18px; }
#overlay-msg p  { color:#fff; font-size:17px; margin-bottom:28px; text-align:center; }
#restart-btn {
  background:#f5c842; color:#000; border:none; border-radius:12px;
  padding:14px 44px; font-size:18px; font-weight:900; cursor:pointer;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- LOADING -->
<div id="loading-screen">
  <h1>🍜 3Dラーメン屋シミュレーター</h1>
  <p id="loading-msg">3Dモデルを読み込み中...</p>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="status-bar">
    💴 所持金: <span id="money-val">$100</span><br>
    🍜 麺: <span id="inv-noodle">0</span> /3　
    🥣 スープ: <span id="inv-soup">0</span> /3<br>
    🥚 具材: <span id="inv-topping">0</span> /3
  </div>
  <div id="objective">📋 目標<br><span id="obj-text">PCで食材を発注しよう！</span></div>
  <div id="inventory-bar">📦 手に持っているもの: <span id="carry-text">なし</span></div>
  <div id="carry-indicator"></div>
</div>

<div id="action-prompt">タップして操作</div>
<div id="toast"></div>

<!-- PC発注モーダル -->
<div id="order-modal">
  <div id="order-panel">
    <h2>🖥️ 発注システム</h2>
    <div class="subtitle">食材を仕入れて店を切り盛りしよう！</div>
    <div class="order-item">
      <div><div class="name">🍜 麺の箱</div><div class="price">$10</div></div>
      <button class="order-btn" onclick="orderItem('noodle',10)">発注</button>
    </div>
    <div class="order-item">
      <div><div class="name">🥣 スープ缶</div><div class="price">$15</div></div>
      <button class="order-btn" onclick="orderItem('soup',15)">発注</button>
    </div>
    <div class="order-item">
      <div><div class="name">🥚 具材パック</div><div class="price">$20</div></div>
      <button class="order-btn" onclick="orderItem('topping',20)">発注</button>
    </div>
    <button id="close-order" onclick="closeOrderModal()">✕ 閉じる</button>
  </div>
</div>

<!-- ジョイスティック -->
<div id="joystick-zone">
  <div id="joystick-base"></div>
  <div id="joystick-thumb"></div>
</div>

<!-- アクションボタン -->
<div id="action-btn">アクション</div>

<!-- オーバーレイ -->
<div id="overlay-msg">
  <h1 id="overlay-title">🎉 本日の営業終了！</h1>
  <p id="overlay-sub"></p>
  <button id="restart-btn" onclick="restartGame()">もう一度プレイ</button>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

// ============================================================
// ゲームステート
// ============================================================
const MAX_STOCK = 3; // 棚の最大在庫

let money        = 100;
let inventory    = { noodle:0, soup:0, topping:0 };
let carryingBox  = null;   // { mesh, type }
let carryMesh    = null;
let orderModalOpen = false;
let gameRunning  = true;
let customersServed = 0;
let salesTotal   = 0;

let customers         = [];
let customerIdCounter = 0;
const CUSTOMER_INTERVAL = 14000;
let customerTimer       = 0;
const MAX_CUSTOMERS     = 3;

let boxes = [];   // { mesh, type, onShelf }

// ロード済みGLTFテンプレート
let ramenTemplate   = null;   // ramen.glb
let humanTemplates  = [];     // [human1, human2, human3]
const HUMAN_WEIGHTS = [0.50, 0.20, 0.30];

// ============================================================
// Three.js セットアップ
// ============================================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x87ceeb);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x87ceeb, 18, 38);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 60);
camera.position.set(0, 1.65, 3);

// ============================================================
// ライティング
// ============================================================
scene.add(new THREE.AmbientLight(0xfff8e7, 0.60));
const sun = new THREE.DirectionalLight(0xfff5e0, 1.05);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top  =  18; sun.shadow.camera.bottom= -18;
sun.shadow.camera.far  = 50;
scene.add(sun);

// 室内ポイントライト
[[-3,2.8,0],[3,2.8,0],[0,2.8,-3],[0,2.8,3]].forEach(([x,y,z])=>{
  const pl = new THREE.PointLight(0xffe8c0, 0.65, 9);
  pl.position.set(x,y,z);
  scene.add(pl);
});

// ============================================================
// ヘルパー
// ============================================================
function mat(color, rough=0.85, metal=0){
  return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
}
function mkBox(w,h,d,color,rough,metal){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,rough,metal));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function mkCyl(rt,rb,h,seg,color,rough=0.85){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,rough));
  m.castShadow = true; m.receiveShadow = true; return m;
}

// ============================================================
// マップ定数
// ============================================================
const ROOM_W = 16, ROOM_D = 14, WALL_H = 3.6, WALL_T = 0.22;
const DOOR_W  = 2.0;  // 入り口幅
const PC_POS      = new THREE.Vector3(-6.0, 0, -5.0);
const SHELF_POS   = new THREE.Vector3( 6.0, 0, -5.0);
const COUNTER_POS = new THREE.Vector3( 0.0, 0,  1.2);
const DELIVERY_POS= new THREE.Vector3( 4.5, 0,  5.5);
// 入り口: 手前壁中央に穴
const DOOR_Z      = ROOM_D/2;  // 手前壁のZ
// お客さんスポーン/ゴール
const SPAWN_Z     = DOOR_Z + 4.0;
const CUSTOMER_TARGET_Z = COUNTER_POS.z + 1.7;

const BOUNDS = {
  xMin: -ROOM_W/2 + 0.5,
  xMax:  ROOM_W/2 - 0.5,
  zMin: -ROOM_D/2 + 0.5,
  zMax:  ROOM_D/2 + 3.5   // 入り口外まで少し出られる
};

// ============================================================
// 店舗マップ構築
// ============================================================
(function buildMap(){
  // ---- 床（木目調焦げ茶） ----
  const floorMat = new THREE.MeshStandardMaterial({
    color:0x5a3d28, roughness:0.92, metalness:0
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W+4, ROOM_D+10), floorMat);
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  floor.position.set(0, 0, 2);
  scene.add(floor);

  // 床の板目ストライプ（演出）
  for(let i=-7; i<=7; i++){
    const stripe = mkBox(0.06, 0.005, ROOM_D+8, i%2===0?0x4a2e18:0x6b4830);
    stripe.position.set(i*1.1, 0.003, 2); stripe.receiveShadow=false;
    scene.add(stripe);
  }

  // ---- 天井 ----
  const ceilMat = mat(0xf0ece0, 1);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D+2), ceilMat);
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, WALL_H, 1);
  scene.add(ceil);

  // ---- 壁 ----
  const wallMat = mat(0xf0e0c8, 0.95);
  function wall(w,h,d,x,y,z,ry=0){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
    m.position.set(x,y,z); m.rotation.y = ry;
    m.receiveShadow = true; scene.add(m);
  }
  // 奥壁
  wall(ROOM_W, WALL_H, WALL_T, 0, WALL_H/2, -ROOM_D/2);
  // 左壁
  wall(WALL_T, WALL_H, ROOM_D+1, -ROOM_W/2, WALL_H/2, 0);
  // 右壁
  wall(WALL_T, WALL_H, ROOM_D+1,  ROOM_W/2, WALL_H/2, 0);
  // 手前壁（中央にドア穴）: 左半 + 右半 + 上まぐさ
  const sideW = (ROOM_W - DOOR_W)/2;
  const doorH = 2.6;
  wall(sideW, WALL_H, WALL_T, -ROOM_W/2+sideW/2, WALL_H/2,  ROOM_D/2);
  wall(sideW, WALL_H, WALL_T,  ROOM_W/2-sideW/2, WALL_H/2,  ROOM_D/2);
  wall(DOOR_W, WALL_H-doorH, WALL_T, 0, doorH+(WALL_H-doorH)/2, ROOM_D/2);
  // ドア枠
  const frameMat = mat(0x6b3c0e, 0.7);
  const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.10, doorH, 0.18), frameMat);
  frameL.position.set(-DOOR_W/2, doorH/2, ROOM_D/2); scene.add(frameL);
  const frameR = frameL.clone();
  frameR.position.set( DOOR_W/2, doorH/2, ROOM_D/2); scene.add(frameR);
  const frameT = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W+0.2, 0.12, 0.18), frameMat);
  frameT.position.set(0, doorH, ROOM_D/2); scene.add(frameT);

  // ---- 壁装飾（のれん） ----
  [[-ROOM_W/2+0.14, 2.5, 0],[ROOM_W/2-0.14, 2.5, 0]].forEach(([x,y,z])=>{
    const ng = new THREE.Group();
    [0xd63031, 0xffffff, 0xd63031].forEach((c,i)=>{
      const s = mkBox(0.28,0.85,0.04,c);
      s.position.x = (i-1)*0.32; ng.add(s);
    });
    ng.position.set(x,y,z); scene.add(ng);
  });

  // ---- 看板（奥壁上部） ----
  const sign = mkBox(3.5, 0.6, 0.08, 0x8B0000);
  sign.position.set(0, WALL_H-0.4, -ROOM_D/2+0.06);
  scene.add(sign);

  // ---- 配達エリア（黄色床マーキング） ----
  const delMat = new THREE.MeshStandardMaterial({
    color:0xf5c842, roughness:1, transparent:true, opacity:0.68
  });
  const del = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.8), delMat);
  del.rotation.x = -Math.PI/2;
  del.position.set(DELIVERY_POS.x, 0.012, DELIVERY_POS.z);
  scene.add(del);
  // 「配達」文字プレート
  const delPlate = mkBox(1.4, 0.05, 0.4, 0xe0a800);
  delPlate.position.set(DELIVERY_POS.x, 0.025, DELIVERY_POS.z);
  scene.add(delPlate);

  // ---- 客席（丸椅子） ----
  const seatColors = [0x7b4f2e, 0x6b3e1e, 0x8b5e3a];
  for(let i=-1; i<=1; i++){
    const stool = mkCyl(0.22,0.22, 0.42, 16, seatColors[(i+1)]);
    stool.position.set(i*1.5, 0.21, COUNTER_POS.z + 1.9);
    scene.add(stool);
    const seat = mkCyl(0.26,0.26, 0.06, 16, 0x4a2800);
    seat.position.set(i*1.5, 0.45, COUNTER_POS.z + 1.9);
    scene.add(seat);
    // 背もたれ風
    const back = mkBox(0.42, 0.5, 0.06, 0x4a2800);
    back.position.set(i*1.5, 0.72, COUNTER_POS.z + 1.65);
    scene.add(back);
  }

  // ---- 店外の歩道（色を変えて区別） ----
  const sideMat = new THREE.MeshStandardMaterial({color:0x888890, roughness:0.95});
  const side = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W+2, 10), sideMat);
  side.rotation.x = -Math.PI/2;
  side.position.set(0, -0.001, ROOM_D/2+5);
  scene.add(side);
})();

// ============================================================
// 発注用PC（青いデスク）
// ============================================================
(function buildPC(){
  const g = new THREE.Group();
  const desk = mkBox(1.7,0.09,0.85, 0x2d6dbf);
  desk.position.y = 0.82; g.add(desk);
  [[0.72,0.38],[0.72,-0.38],[-0.72,0.38],[-0.72,-0.38]].forEach(([x,z])=>{
    const leg = mkBox(0.07,0.82,0.07, 0x1a4a8a);
    leg.position.set(x,0.41,z); g.add(leg);
  });
  const mon = mkBox(0.68,0.48,0.045, 0x111, 0.2);
  mon.position.set(0, 1.12, -0.32); g.add(mon);
  const scr = mkBox(0.60,0.40,0.01, 0x00d4ff, 0.15, 0.1);
  scr.position.set(0, 1.12, -0.295); g.add(scr);
  const kb = mkBox(0.42,0.022,0.19, 0x333);
  kb.position.set(0, 0.87, 0.12); g.add(kb);
  const mouse = mkBox(0.08,0.025,0.12, 0x444);
  mouse.position.set(0.28, 0.87, 0.12); g.add(mouse);
  g.position.copy(PC_POS);
  scene.add(g);
})();

// ============================================================
// 在庫棚（緑の棚）
// ============================================================
const shelfItemsGroup = new THREE.Group();
(function buildShelf(){
  const g = new THREE.Group();
  const back = mkBox(2.8, 2.4, 0.09, 0x2ecc71);
  back.position.y = 1.2; g.add(back);
  const side1 = mkBox(0.07, 2.4, 0.52, 0x27ae60);
  side1.position.set(-1.35, 1.2, 0.22); g.add(side1);
  const side2 = side1.clone(); side2.position.set(1.35, 1.2, 0.22); g.add(side2);
  [0.42, 1.0, 1.62].forEach(y=>{
    const shelf = mkBox(2.66, 0.07, 0.50, 0x27ae60);
    shelf.position.set(0, y, 0.22); g.add(shelf);
  });
  shelfItemsGroup.position.set(0,0,0);
  g.add(shelfItemsGroup);
  g.position.copy(SHELF_POS);
  scene.add(g);
})();

// ============================================================
// 棚ビジュアル更新（最大3個ずつ積み上げ）
// ============================================================
const SHELF_COLORS = { noodle:0xf0d060, soup:0x70b8ff, topping:0xffaa44 };
function updateShelfVisuals(){
  while(shelfItemsGroup.children.length){ shelfItemsGroup.remove(shelfItemsGroup.children[0]); }
  const yLevels = [0.5, 1.08, 1.7];
  const types   = ['noodle','soup','topping'];
  types.forEach((type, ti)=>{
    const count = Math.min(inventory[type], MAX_STOCK);
    for(let i=0; i<count; i++){

// ============================================================
// GLTFLoader（Three.js r128 内蔵版）
// ============================================================
// Three r128のCDNにはGLTFLoaderが含まれないため、インライン実装
// --- 最小限のGLTFLoader polyfill ---
// ramen.glbとhuman*.glbのロードを試みて、失敗した場合はフォールバック形状を使う
class SafeGLTFLoader {
  load(url, onLoad, onProgress, onError){
    // Three.js r128ではGLTFLoaderは別ファイル。CDNから動的ロード
    if(typeof THREE.GLTFLoader !== 'undefined'){
      const loader = new THREE.GLTFLoader();
      loader.load(url, onLoad, onProgress, onError);
      return;
    }
    // GLTFLoaderが無ければフォールバック
    if(onError) onError(new Error('GLTFLoader not available'));
  }
}

// GLTFLoaderを動的ロード
function loadGLTFLoaderScript(cb){
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
  s.onload  = ()=>{ cb(null); };
  s.onerror = ()=>{ cb(new Error('script load failed')); };
  document.head.appendChild(s);
}

function pickHumanTemplate(){
  const r = Math.random();
  if(r < 0.50 && humanTemplates[0]) return humanTemplates[0].clone();
  if(r < 0.70 && humanTemplates[1]) return humanTemplates[1].clone();
  if(humanTemplates[2]) return humanTemplates[2].clone();
  if(humanTemplates[0]) return humanTemplates[0].clone();
  return makeFallbackHuman(customerIdCounter % 3);
}

function spawnCustomer(){
  if(customers.length >= MAX_CUSTOMERS) return;
  const id   = customerIdCounter++;
  const slot = customers.length;
  const targetX = COUNTER_POS.x + (slot-1)*1.4;

  const mesh = pickHumanTemplate();
  // 店外からスポーン
  mesh.position.set(targetX*0.3, 0, SPAWN_Z);
  mesh.rotation.y = Math.PI; // 店の方を向く
  mesh.castShadow = true;
  scene.add(mesh);

  const speechEl = document.createElement('div');
  speechEl.className = 'speech-bubble';
  speechEl.textContent = '🚶 入店中...';
  document.body.appendChild(speechEl);

  const c = {
    mesh, state:'walking', timer:0,
    ramenMesh:null, coinMesh:null, speechEl, id,
    targetX, targetZ: CUSTOMER_TARGET_Z
  };
  customers.push(c);
}

function removeCustomer(c){
  scene.remove(c.mesh);
  if(c.ramenMesh) scene.remove(c.ramenMesh);
  if(c.coinMesh)  scene.remove(c.coinMesh);
  if(c.speechEl)  c.speechEl.remove();
  customers = customers.filter(x=>x!==c);
}

// ラーメン生成（GLTFまたはフォールバック）
// ============================================================
function makeRamenForCounter(x,y,z){
  let ramen;
  if(ramenTemplate){
    ramen = ramenTemplate.clone();
    // スケール調整（どんぶりサイズ = 直径約30cm）
    const box3 = new THREE.Box3().setFromObject(ramen);
    const size = new THREE.Vector3();
    box3.getSize(size);
    const maxDim = Math.max(size.x, size.z);
    const targetDiam = 0.30;
    const sc = maxDim > 0 ? targetDiam/maxDim : 1;
    ramen.scale.set(sc,sc,sc);
    // 接地
    const box2 = new THREE.Box3().setFromObject(ramen);
    const minY  = box2.min.y;
    ramen.position.set(x, y - minY, z);
  } else {
    ramen = makeFallbackRamen();
    ramen.position.set(x,y,z);
  }
  return ramen;
}

// ============================================================
// ジョイスティック
// ============================================================
const jsZone  = document.getElementById('joystick-zone');
const jsThumb = document.getElementById('joystick-thumb');
let jsTouchId = null;
const jsVec   = new THREE.Vector2(0,0);
const JS_MAX  = 48;

function jsRect(){ return jsZone.getBoundingClientRect(); }

jsZone.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  jsTouchId = t.identifier;
  updateThumb(t);
},{passive:false});
jsZone.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===jsTouchId){ updateThumb(t); break; }
  }
},{passive:false});
['touchend','touchcancel'].forEach(ev=>jsZone.addEventListener(ev, e=>{
  for(const t of e.changedTouches){
    if(t.identifier===jsTouchId){
      jsTouchId=null; jsVec.set(0,0);
      jsThumb.style.transform='translate(-50%,-50%)';
      break;
    }
  }
}));
function updateThumb(touch){
  const r  = jsRect();
  const cx = r.left+r.width/2, cy = r.top+r.height/2;
  let dx = touch.clientX-cx, dy = touch.clientY-cy;
  const dist = Math.hypot(dx,dy);
  if(dist > JS_MAX){ dx*=JS_MAX/dist; dy*=JS_MAX/dist; }
  jsVec.set(dx/JS_MAX, dy/JS_MAX);
  jsThumb.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}

// ============================================================
// 視点スワイプ
// ============================================================
let lookId=null, lookLX=0, lookLY=0;
const LOOK_SENS = 0.0058;

canvas.addEventListener('touchstart', e=>{
  if(orderModalOpen) return;
  for(const t of e.changedTouches){
    const r = jsRect();
    const inJS = t.clientX>=r.left-12 && t.clientX<=r.right+12 &&
                 t.clientY>=r.top-12  && t.clientY<=r.bottom+12;
    const inBtn= t.clientX>=window.innerWidth-120 && t.clientY>=window.innerHeight-120;
    if(!inJS && !inBtn && lookId===null){
      lookId=t.identifier; lookLX=t.clientX; lookLY=t.clientY;
    }
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  if(orderModalOpen) return;
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===lookId){
      yaw   -= (t.clientX-lookLX)*LOOK_SENS;
      pitch -= (t.clientY-lookLY)*LOOK_SENS;
      pitch  = Math.max(-1.1, Math.min(1.1, pitch));
      lookLX=t.clientX; lookLY=t.clientY;
    }
  }
},{passive:false});
['touchend','touchcancel'].forEach(ev=>canvas.addEventListener(ev,e=>{
  for(const t of e.changedTouches){
    if(t.identifier===lookId){ lookId=null; }
  }
}));

// アクションボタン
// ============================================================
const actionBtn = document.getElementById('action-btn');
let actionCD    = 0;

function doAction(){
  if(!gameRunning || actionCD>0) return;
  actionCD = 320;

  const flat = new THREE.Vector3(playerPos.x,0,playerPos.z);
  const pcD  = flat.distanceTo(new THREE.Vector3(PC_POS.x,0,PC_POS.z));
  const shD  = flat.distanceTo(new THREE.Vector3(SHELF_POS.x,0,SHELF_POS.z));
  const ctD  = flat.distanceTo(new THREE.Vector3(COUNTER_POS.x,0,COUNTER_POS.z));

  // --- PC発注 ---
  if(pcD < 2.6 && !carryingBox){ openOrderModal(); return; }

  // --- 段ボールを拾う ---
  if(!carryingBox){
    let best=null, bestD=2.2;
    boxes.forEach(b=>{
      if(b.onShelf) return;
      const d = flat.distanceTo(new THREE.Vector3(b.mesh.position.x,0,b.mesh.position.z));
      if(d<bestD){ bestD=d; best=b; }
    });
    if(best){
      carryingBox = best; carryMesh = best.mesh;
      showToast(`📦 ${BOX_LABELS[best.type]}を持ち上げた！`);
      updateUI(); return;
    }
  }

  // --- 棚へ収納（最大3） ---
  if(carryingBox && shD < 3.2){
    const type = carryingBox.type;
    if(inventory[type] >= MAX_STOCK){
      showToast('🚫 棚が満杯です！'); return;
    }
    inventory[type]++;
    scene.remove(carryingBox.mesh);
    boxes = boxes.filter(b=>b!==carryingBox);
    carryingBox=null; carryMesh=null;
    updateShelfVisuals(); updateUI();
    showToast(`✅ ${BOX_LABELS[type]}を棚に収納！(${inventory[type]}/${MAX_STOCK})`);
    return;
  }

  // --- 段ボールを下ろす ---
  if(carryingBox){
    const fwd = getCamFwd();
    carryMesh.position.set(playerPos.x+fwd.x*0.9, 0.26, playerPos.z+fwd.z*0.9);
    carryMesh=null; carryingBox=null;
    updateUI(); showToast('📦 段ボールを置いた'); return;
  }

  // --- カウンター操作 ---
  if(ctD < 2.9){
    // コイン回収
    const coinC = customers.find(c=>c.coinMesh && c.state==='paid');
    if(coinC){
      money += 25; salesTotal += 25;
      scene.remove(coinC.coinMesh); coinC.coinMesh=null;
      customersServed++;
      updateUI(); showToast('💰 +$25 売上！');
      removeCustomer(coinC); return;
    }
    // ラーメン提供
    const waitC = customers.find(c=>c.state==='waiting');
    if(waitC){
      if(!inventory.noodle || !inventory.soup || !inventory.topping){
        showToast('🚫 食材が足りません！棚を補充してください'); return;
      }
      inventory.noodle--; inventory.soup--; inventory.topping--;
      updateShelfVisuals(); updateUI();
      const rx = waitC.targetX;
      const ramen = makeRamenForCounter(rx, 0.96, COUNTER_POS.z-0.08);
      scene.add(ramen);
      waitC.ramenMesh=ramen; waitC.state='eating';
      if(waitC.speechEl) waitC.speechEl.textContent='😋 いただきます！';
      showToast('🍜 ラーメンを提供！');
      setTimeout(()=>{
        if(!waitC.coinMesh){
          const coin = makeCoin(rx, 1.06, COUNTER_POS.z-0.18);
          scene.add(coin); waitC.coinMesh=coin; waitC.state='paid';
          if(waitC.ramenMesh){ scene.remove(waitC.ramenMesh); waitC.ramenMesh=null; }
          if(waitC.speechEl) waitC.speechEl.textContent='💰 ありがとう！';
          showToast('💰 コインをタップして受け取ろう！');
        }
      }, 2600);
      return;
    }
  }
}

actionBtn.addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); doAction(); },{passive:false});

// ============================================================
// カメラ前方ベクトル（Y無視）
// ============================================================
function getCamFwd(){
  return new THREE.Vector3(
    -Math.sin(yaw)*Math.cos(pitch),0,-Math.cos(yaw)*Math.cos(pitch)
  ).normalize();
}
function getCamRight(){
  return new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)).normalize();
}

// ============================================================
// ゲームループ
// ============================================================
let lastTime  = 0;
let coinBobT  = 0;

function animate(ts){
  requestAnimationFrame(animate);
  const dt = Math.min((ts-lastTime)/1000, 0.05);
  lastTime = ts;
  if(!gameRunning) return;

  actionCD = Math.max(0, actionCD - dt*1000);
  customerTimer += dt*1000;

  // お客さんスポーン
  if(customerTimer > CUSTOMER_INTERVAL && customers.length < MAX_CUSTOMERS){
    spawnCustomer(); customerTimer=0;
  }

  // ---- プレイヤー移動（カメラ視点基準FPS） ----
  if(!orderModalOpen && (jsVec.x!==0 || jsVec.y!==0)){
    const speed = 4.8;
    const fwd   = getCamFwd();
    const right = getCamRight();
    const move  = new THREE.Vector3();
    // スティック前後 → カメラ前後 (jsVec.y: 上=-1=前進)
    move.addScaledVector(fwd,  -jsVec.y * speed * dt);
    // スティック左右 → カメラ左右
    move.addScaledVector(right, jsVec.x * speed * dt);
    playerPos.add(move);
    playerPos.x = Math.max(BOUNDS.xMin, Math.min(BOUNDS.xMax, playerPos.x));
    playerPos.z = Math.max(BOUNDS.zMin, Math.min(BOUNDS.zMax, playerPos.z));
  }

  // ---- カメラ更新 ----
  camera.position.copy(playerPos);
  camera.lookAt(
    playerPos.x + Math.sin(yaw)*Math.cos(pitch)*10,
    playerPos.y + Math.sin(pitch)*10,
    playerPos.z + Math.cos(yaw)*Math.cos(pitch)*10
  );

  // ---- 持ち段ボール追従 ----
  if(carryMesh){
    const f = getCamFwd();
    carryMesh.position.set(
      playerPos.x + f.x*0.85,
      playerPos.y - 0.88,
      playerPos.z + f.z*0.85
    );
    carryMesh.rotation.y += dt*1.4;
  }

  // ---- お客さん歩行AI ----
  customers.forEach(c=>{
    if(c.state==='walking'){
      const tx = c.targetX, tz = c.targetZ;
      const dx = tx - c.mesh.position.x;
      const dz = tz - c.mesh.position.z;
      const dist = Math.hypot(dx,dz);
      const walkSpeed = 2.2;
      if(dist > 0.08){
        c.mesh.position.x += (dx/dist)*walkSpeed*dt;
        c.mesh.position.z += (dz/dist)*walkSpeed*dt;
        // 進行方向を向く
        c.mesh.rotation.y = Math.atan2(dx,dz)+Math.PI;
        // 歩行ボブ
        c.mesh.position.y = Math.abs(Math.sin(ts*0.005))*0.04;
      } else {
        c.mesh.position.set(tx,0,tz);
        c.mesh.rotation.y = Math.PI;
        c.state = 'waiting';
        if(c.speechEl) c.speechEl.textContent='🍜 ラーメン1杯！';
      }
    }
  });

  // ---- コインボブ ----
  coinBobT += dt;
  customers.forEach(c=>{
    if(c.coinMesh){
      c.coinMesh.position.y = 1.06 + Math.sin(coinBobT*3)*0.05;
      c.coinMesh.rotation.y += dt*2.2;
    }
  });

  updateActionPrompt();
  updateSpeechBubbles();
  updateUI();
  renderer.render(scene, camera);
}

window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// リスタート
// ============================================================
function restartGame(){
  money=100; inventory={noodle:0,soup:0,topping:0};
  carryingBox=null; carryMesh=null;
  customers.forEach(c=>{ scene.remove(c.mesh); if(c.speechEl)c.speechEl.remove(); });
  customers=[]; boxes.forEach(b=>scene.remove(b.mesh)); boxes=[];
  customersServed=0; salesTotal=0; customerTimer=0; gameRunning=true;
  document.getElementById('overlay-msg').classList.remove('active');
  updateShelfVisuals(); updateUI();
}
window.restartGame = restartGame;

// ============================================================
// 起動シーケンス（GLTFLoader動的ロード → モデルロード）
// ============================================================
function setProgress(p, msg){
  document.getElementById('loading-bar').style.width = (p*100)+'%';
  document.getElementById('loading-msg').textContent = msg;
}

function startGame(){
  document.getElementById('loading-screen').style.display='none';
  updateShelfVisuals(); updateUI();
  setTimeout(()=>{
    spawnCustomer();
    showToast('🎮 開店！まずPCで食材を発注しよう！', 3500);
  }, 1000);
  animate(0);
}

function tryLoadModel(loader, url, onSuccess, onFail){
  try{
    loader.load(url,
      gltf=>onSuccess(gltf),
      xhr=>{ if(xhr.total) setProgress(xhr.loaded/xhr.total*0.2, `${url} 読み込み中...`); },
      err=>onFail(err)
    );
  }catch(e){ onFail(e); }
}

setProgress(0,'GLTFLoaderを取得中...');
loadGLTFLoaderScript(err=>{
  if(err || typeof THREE.GLTFLoader==='undefined'){
    // GLTFLoader取得失敗 → フォールバックで続行
    setProgress(1,'フォールバック形状を使用');
    setTimeout(startGame, 600);
    return;
  }

  const loader = new THREE.GLTFLoader();
  let loaded = 0;
  const total = 4; // ramen + human*3

  function oneDone(){
    loaded++;
    setProgress(loaded/total, `モデル読み込み中... (${loaded}/${total})`);
    if(loaded >= total) startGame();
  }

  // ramen.glb
  setProgress(0.05,'ramen.glbを読み込み中...');
  tryLoadModel(loader,'./ramen.glb',
    gltf=>{ ramenTemplate=gltf.scene; oneDone(); },
    _=>{ oneDone(); } // 失敗→フォールバック
  );

  // human1.glb (50%)
  tryLoadModel(loader,'./human1.glb',
    gltf=>{
      const s = gltf.scene;
      // 高さ1.7mになるようスケール調整
      const b = new THREE.Box3().setFromObject(s);
      const sz= new THREE.Vector3(); b.getSize(sz);
      const sc= sz.y>0 ? 1.7/sz.y : 1;
      s.scale.set(sc,sc,sc);
      // 接地
      const b2=new THREE.Box3().setFromObject(s);
      s.position.y -= b2.min.y;
      humanTemplates[0]=s; oneDone();
    },
    _=>{ humanTemplates[0]=makeFallbackHuman(0); oneDone(); }
  );

  // human2.glb (20%)
  tryLoadModel(loader,'./human2.glb',
    gltf=>{
      const s=gltf.scene;
      const b=new THREE.Box3().setFromObject(s);
      const sz=new THREE.Vector3(); b.getSize(sz);
      const sc=sz.y>0?1.7/sz.y:1;
      s.scale.set(sc,sc,sc);
      const b2=new THREE.Box3().setFromObject(s);
      s.position.y-=b2.min.y;
      humanTemplates[1]=s; oneDone();
    },
    _=>{ humanTemplates[1]=makeFallbackHuman(1); oneDone(); }
  );

  // human3.glb (30%)
  tryLoadModel(loader,'./human3.glb',
    gltf=>{
      const s=gltf.scene;
      const b=new THREE.Box3().setFromObject(s);
      const sz=new THREE.Vector3(); b.getSize(sz);
      const sc=sz.y>0?1.7/sz.y:1;
      s.scale.set(sc,sc,sc);
      const b2=new THREE.Box3().setFromObject(s);
      s.position.y-=b2.min.y;
      humanTemplates[2]=s; oneDone();
    },
    _=>{ humanTemplates[2]=makeFallbackHuman(2); oneDone(); }
  );
});
</script>
