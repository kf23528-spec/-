<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3Dラーメン屋シミュレーター</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0a00;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;touch-action:none;}
#canvas{display:block;width:100vw;height:100vh;}

/* === LOADING === */
#loading-screen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#1a0a00;z-index:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#loading-screen h1{color:#f5c842;font-size:26px;text-align:center;padding:0 20px;}
#loading-screen p{color:#bbb;font-size:14px;text-align:center;}
#loading-bar-wrap{width:260px;height:12px;background:rgba(255,255,255,0.12);border-radius:6px;overflow:hidden;}
#loading-bar{height:100%;background:linear-gradient(90deg,#f5c842,#ff8c00);border-radius:6px;width:0%;transition:width .3s;}

/* === HUD === */
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:100;}
#status-bar{
  position:absolute;top:12px;left:12px;
  background:rgba(0,0,0,0.82);border:1.5px solid #f5c842;
  border-radius:12px;padding:9px 15px;
  color:#f5c842;font-size:13px;font-weight:700;line-height:1.85;
  text-shadow:0 1px 4px #000;pointer-events:none;min-width:155px;
}
#money-val{color:#7fff7f;font-size:17px;}
#objective{
  position:absolute;top:12px;right:12px;
  background:rgba(0,0,0,0.82);border:1.5px solid #6ad4ff;
  border-radius:12px;padding:9px 14px;
  color:#6ad4ff;font-size:13px;font-weight:600;
  max-width:250px;text-align:right;pointer-events:none;line-height:1.55;
}
#carry-bar{
  position:absolute;bottom:158px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.82);border:1.5px solid #aaa;
  border-radius:12px;padding:7px 18px;
  color:#fff;font-size:13px;text-align:center;
  pointer-events:none;white-space:nowrap;
}
/* 十字 */
#crosshair{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:22px;height:22px;pointer-events:none;
}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.82);}
#crosshair::before{width:2px;height:100%;left:50%;top:0;margin-left:-1px;}
#crosshair::after{width:100%;height:2px;top:50%;left:0;margin-top:-1px;}

/* === ACTION PROMPT === */
#action-prompt{
  position:fixed;bottom:162px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.90);border:2px solid #f5c842;
  border-radius:18px;padding:9px 24px;
  color:#fff;font-size:14px;font-weight:700;
  pointer-events:none;z-index:101;display:none;white-space:nowrap;
}

/* === TOAST === */
#toast{
  position:fixed;bottom:220px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.90);border:1.5px solid #f5c842;
  border-radius:14px;padding:10px 22px;
  color:#f5c842;font-size:14px;font-weight:700;
  pointer-events:none;z-index:300;
  opacity:0;transition:opacity .3s;white-space:nowrap;
}
#toast.show{opacity:1;}

/* === COOKING STEP UI === */
#cooking-ui{
  position:fixed;bottom:158px;left:50%;transform:translateX(-50%);
  background:rgba(10,20,40,0.94);border:2px solid #4af;
  border-radius:16px;padding:12px 22px;
  color:#fff;font-size:14px;font-weight:700;text-align:center;
  pointer-events:none;z-index:102;display:none;
  white-space:nowrap;line-height:1.7;
}
/* 湯切りボタン */
#yukiri-btn{
  position:fixed;bottom:234px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#2980b9,#1abc9c);
  border:none;border-radius:16px;padding:14px 36px;
  color:#fff;font-size:16px;font-weight:900;
  z-index:200;display:none;cursor:pointer;
  box-shadow:0 4px 18px rgba(26,188,156,0.5);
  user-select:none;-webkit-user-select:none;
  white-space:nowrap;
}
#yukiri-btn:active{transform:translateX(-50%) scale(0.93);}

/* === PC ORDER MODAL === */
#order-modal{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.88);z-index:200;
  align-items:center;justify-content:center;
}
#order-modal.active{display:flex;}
#order-panel{
  background:#1a2636;border:2px solid #4af;border-radius:18px;
  padding:26px 28px;width:min(380px,92vw);color:#fff;text-align:center;
}
#order-panel h2{color:#4af;font-size:19px;margin-bottom:5px;}
#order-panel .subtitle{color:#aaa;font-size:13px;margin-bottom:18px;}
.order-item{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,0.07);border-radius:10px;
  padding:11px 15px;margin-bottom:9px;
}
.order-item .iname{font-size:15px;font-weight:600;}
.order-item .iprice{color:#f5c842;font-size:13px;margin-top:2px;}
.order-btn{
  background:#2a7fff;color:#fff;border:none;border-radius:8px;
  padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;
}
.order-btn:active{background:#1555cc;}
#close-order{
  margin-top:14px;background:#555;color:#fff;border:none;
  border-radius:10px;padding:10px 30px;font-size:15px;
  font-weight:700;cursor:pointer;width:100%;
}
#close-order:active{background:#333;}

/* === JOYSTICK === */
#joystick-zone{
  position:fixed;bottom:16px;left:16px;
  width:140px;height:140px;z-index:110;
}
#joystick-base{
  width:118px;height:118px;border-radius:50%;
  background:rgba(255,255,255,0.10);border:2px solid rgba(255,255,255,0.30);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
}
#joystick-thumb{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,0.50);border:2px solid rgba(255,255,255,0.82);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
}

/* === ACTION BUTTON === */
#action-btn{
  position:fixed;bottom:26px;right:24px;
  width:82px;height:82px;border-radius:50%;
  background:rgba(245,200,66,0.92);border:3px solid #f5c842;
  color:#000;font-size:12px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  z-index:110;cursor:pointer;text-align:center;line-height:1.2;
  user-select:none;-webkit-user-select:none;
  box-shadow:0 4px 18px rgba(245,200,66,.58);
}
#action-btn:active{transform:scale(.92);}

/* === SPEECH BUBBLE === */
.speech-bubble{
  position:fixed;z-index:150;
  background:#fff;color:#222;font-size:12px;font-weight:700;
  border-radius:10px;padding:7px 12px;white-space:nowrap;
  box-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none;
  border:1.5px solid #ccc;
  transform:translateX(-50%) translateY(-100%);
}
.speech-bubble::after{
  content:'';position:absolute;bottom:-8px;left:50%;
  transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#fff;border-bottom:none;
}

/* === OVERLAY === */
#overlay-msg{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.90);z-index:400;
  align-items:center;justify-content:center;flex-direction:column;
}
#overlay-msg.active{display:flex;}
#overlay-msg h1{color:#f5c842;font-size:30px;margin-bottom:16px;text-align:center;}
#overlay-msg p{color:#fff;font-size:16px;margin-bottom:26px;text-align:center;padding:0 30px;}
#restart-btn{
  background:#f5c842;color:#000;border:none;border-radius:12px;
  padding:13px 42px;font-size:17px;font-weight:900;cursor:pointer;
}

/* 画面揺れ演出 */
@keyframes shake{
  0%,100%{transform:translateY(0);}
  20%{transform:translateY(-7px);}
  40%{transform:translateY(6px);}
  60%{transform:translateY(-5px);}
  80%{transform:translateY(4px);}
}
.shaking{animation:shake 0.22s ease;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- LOADING -->
<div id="loading-screen">
  <h1>🍜 3Dラーメン屋シミュレーター</h1>
  <p id="loading-msg">起動中...</p>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="status-bar">
    💴 所持金: <span id="money-val">$200</span><br>
    📦 発注残: <span id="order-stock">0</span>箱<br>
    🍜 完成ラーメン: <span id="ramen-ready">0</span>杯
  </div>
  <div id="objective">📋 次の目標<br><span id="obj-text">お客さんを待とう</span></div>
  <div id="carry-bar">🤲 手に持つ: <span id="carry-text">なし</span></div>
  <div id="crosshair"></div>
</div>

<div id="action-prompt">タップして操作</div>
<div id="cooking-ui"></div>
<button id="yukiri-btn" onclick="doYukiri()">💦 湯切り！（あと<span id="yukiri-count">3</span>回）</button>
<div id="toast"></div>

<!-- PC発注モーダル -->
<div id="order-modal">
  <div id="order-panel">
    <h2>🖥️ 仕入れシステム</h2>
    <div class="subtitle">食材セットを仕入れよう（1セット$30）</div>
    <div class="order-item">
      <div><div class="iname">🎁 食材セット（麺＋スープ＋トッピング）</div><div class="iprice">$30 × <span id="order-qty">1</span>セット</div></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="order-btn" style="padding:8px 10px;font-size:18px;" onclick="changeOrderQty(-1)">－</button>
        <span id="order-qty2" style="font-size:18px;font-weight:900;min-width:24px;text-align:center;">1</span>
        <button class="order-btn" style="padding:8px 10px;font-size:18px;" onclick="changeOrderQty(1)">＋</button>
        <button class="order-btn" onclick="doOrder()">発注</button>
      </div>
    </div>
    <button id="close-order" onclick="closeOrderModal()">✕ 閉じる</button>
  </div>
</div>

<!-- ジョイスティック -->
<div id="joystick-zone">
  <div id="joystick-base"></div>
  <div id="joystick-thumb"></div>
</div>

<!-- アクションボタン -->
<div id="action-btn">アクション</div>

<!-- ゲームオーバーオーバーレイ -->
<div id="overlay-msg">
  <h1 id="overlay-title">🎉 本日の営業終了！</h1>
  <p id="overlay-sub"></p>
  <button id="restart-btn" onclick="restartGame()">もう一度プレイ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

// ================================================================
// ゲームステート
// ================================================================
let money           = 200;
let orderStock      = 0;
let readyRamen      = 0;
let gameRunning     = true;
let customersServed = 0;
let orderModalOpen  = false;
let orderQty        = 1;

// お客さん
let customers         = [];
let customerIdCounter = 0;
const CUSTOMER_INTERVAL = 14000;
let customerTimer       = 0;
const MAX_CUSTOMERS     = 3;

// GLTFテンプレート
let ramenTemplate  = null;
let humanTemplates = [];

// ================================================================
// 調理ステートマシン
// ================================================================
const STEPS = {
  IDLE:0,
  HAVE_RAW:1,      // 生麺を持っている
  BOILING:2,       // 茹で中（タイマー待ち）
  BOILED_WAIT:3,   // 茹で完了→麺上げ待ち
  YUKIRI_WAIT:4,   // 湯切り連打待ち
  NOODLE_READY:5,  // 麺完成→丼取りへ
  HAVE_BOWL:6,     // 空の丼を持っている
  BOWL_SOUP:7,     // スープを注いだ
  BOWL_NOODLE:8,   // 麺を投入した
  BOWL_NEGI:9,     // ネギを乗せた
  RAMEN_COMPLETE:10, // 完成→カウンターへ
};

let cookStep   = STEPS.IDLE;
let handItem   = 'empty';
let handMesh   = null;
let yukiriLeft = 3;
let boilTimer  = 0;
let isBoiling  = false;

// ================================================================
// Three.js セットアップ
// ================================================================
const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x87ceeb);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x87ceeb, 20, 44);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 60);
camera.position.set(0, 1.65, 3.5);

// ================================================================
// ライティング
// ================================================================
scene.add(new THREE.AmbientLight(0xfff8e7, 0.65));
const sun = new THREE.DirectionalLight(0xfff5e0, 1.08);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top  = 22;  sun.shadow.camera.bottom = -22;
sun.shadow.camera.far  = 56;
scene.add(sun);
[[-4,2.8,-2],[4,2.8,-2],[0,2.8,1],[-4,2.8,3],[4,2.8,3]].forEach(([x,y,z])=>{
  const pl = new THREE.PointLight(0xffe8c0, 0.62, 10);
  pl.position.set(x,y,z); scene.add(pl);
});

// ================================================================
// ヘルパー
// ================================================================
function mat(color, rough=0.85, metal=0){
  return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
}
function mkBox(w, h, d, color, rough, metal){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color, rough??0.85, metal??0));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function mkCyl(rt, rb, h, seg, color, rough=0.85){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,rough));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function mkSph(r, seg, color, rough=0.85){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg), mat(color,rough));
  m.castShadow = true; return m;
}

// ================================================================
// マップ定数
// ================================================================
const ROOM_W = 18, ROOM_D = 15, WALL_H = 3.6, WALL_T = 0.22;
const DOOR_W = 2.2;

// インタラクト座標
const PC_POS        = new THREE.Vector3(-7.0, 0, -6.0);
const COUNTER_POS   = new THREE.Vector3( 0.0, 0,  1.5);
const DELIVERY_POS  = new THREE.Vector3( 5.5, 0,  5.5);

// 厨房スペース座標（ワールド）
const NOODLE_SPACE  = new THREE.Vector3(-6.0, 0, -4.5);
const POT_SPACE     = new THREE.Vector3(-2.2, 0, -5.8);
const CHASHU_SPACE  = new THREE.Vector3( 2.8, 0, -5.8);
const NEGI_SPACE    = new THREE.Vector3( 6.0, 0, -4.5);

const SPAWN_Z     = ROOM_D/2 + 4.5;
const CUSTOMER_TZ = COUNTER_POS.z + 1.8;

const BOUNDS = {
  xMin: -ROOM_W/2 + 0.5, xMax: ROOM_W/2 - 0.5,
  zMin: -ROOM_D/2 + 0.5, zMax: ROOM_D/2 + 4.2
};

// ================================================================
// 店舗マップ構築
// ================================================================
(function buildMap(){
  // 床
  const floorMat = new THREE.MeshStandardMaterial({color:0x5a3d28, roughness:0.92});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W+6, ROOM_D+14), floorMat);
  floor.rotation.x = -Math.PI/2; floor.position.set(0,0,2); floor.receiveShadow = true;
  scene.add(floor);
  // 床ストライプ
  for(let i=-9; i<=9; i++){
    const s = mkBox(0.055, 0.004, ROOM_D+12, i%2===0?0x4a2e18:0x6b4830);
    s.position.set(i*1.02, 0.002, 2); scene.add(s);
  }
  // 厨房区切り仕切り
  const divMat = mat(0xddc8a0, 0.9);
  const div = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.06, WALL_T*0.8), divMat);
  div.position.set(0, 0.03, -2.8); scene.add(div);
  // 仕切りの小壁（可視化）
  const divWall = mkBox(ROOM_W, 1.1, WALL_T, 0xddc8a0, 0.9);
  divWall.position.set(0, 0.55, -2.8); scene.add(divWall);

  // 厨房床
  const kitchenFloor = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_W, ROOM_D/2-2.5),
    new THREE.MeshStandardMaterial({color:0x3e2a14, roughness:0.95})
  );
  kitchenFloor.rotation.x = -Math.PI/2;
  kitchenFloor.position.set(0, 0.001, -(ROOM_D/4+1.4));
  scene.add(kitchenFloor);

  // 天井
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D+2), mat(0xf0ece0,1));
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, WALL_H, 0.5); scene.add(ceil);

  // 壁
  const wm = mat(0xf0e0c8, 0.95);
  function wall(w,h,d,x,y,z){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wm);
    m.position.set(x,y,z); m.receiveShadow = true; scene.add(m);
  }
  wall(ROOM_W, WALL_H, WALL_T, 0, WALL_H/2, -ROOM_D/2);
  wall(WALL_T, WALL_H, ROOM_D+1, -ROOM_W/2, WALL_H/2, 0);
  wall(WALL_T, WALL_H, ROOM_D+1,  ROOM_W/2, WALL_H/2, 0);
  const sw = (ROOM_W-DOOR_W)/2;
  const dh = 2.6;
  wall(sw, WALL_H, WALL_T, -ROOM_W/2+sw/2, WALL_H/2, ROOM_D/2);
  wall(sw, WALL_H, WALL_T,  ROOM_W/2-sw/2, WALL_H/2, ROOM_D/2);
  wall(DOOR_W, WALL_H-dh, WALL_T, 0, dh+(WALL_H-dh)/2, ROOM_D/2);

  // ドア枠
  const fm = mat(0x6b3c0e, 0.7);
  const fL = new THREE.Mesh(new THREE.BoxGeometry(0.10, dh, 0.18), fm);
  fL.position.set(-DOOR_W/2, dh/2, ROOM_D/2); scene.add(fL);
  const fR = fL.clone(); fR.position.set(DOOR_W/2, dh/2, ROOM_D/2); scene.add(fR);
  const fT = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W+0.2, 0.12, 0.18), fm);
  fT.position.set(0, dh, ROOM_D/2); scene.add(fT);

  // のれん（両側壁付近）
  [[-ROOM_W/2+0.14, 2.5, 0],[ROOM_W/2-0.14, 2.5, 0]].forEach(([x,y,z])=>{
    const ng = new THREE.Group();
    [0xd63031, 0xffffff, 0xd63031].forEach((c,i)=>{
      const s = mkBox(0.28, 0.85, 0.04, c); s.position.x=(i-1)*0.32; ng.add(s);
    });
    ng.position.set(x,y,z); scene.add(ng);
  });

  // 看板
  const sign = mkBox(4.2, 0.66, 0.10, 0x8B0000);
  sign.position.set(0, WALL_H-0.42, -ROOM_D/2+0.07); scene.add(sign);
  const signL = mkBox(3.8, 0.46, 0.02, 0xffd700, 0.3);
  signL.position.set(0, WALL_H-0.42, -ROOM_D/2+0.12); scene.add(signL);

  // 配達エリア（黄色マーカー）
  const da = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 3.2),
    new THREE.MeshStandardMaterial({color:0xf5c842, roughness:1, transparent:true, opacity:0.65})
  );
  da.rotation.x = -Math.PI/2; da.position.set(DELIVERY_POS.x, 0.013, DELIVERY_POS.z);
  scene.add(da);
  const dap = mkBox(1.6, 0.05, 0.46, 0xe0a800);
  dap.position.set(DELIVERY_POS.x, 0.026, DELIVERY_POS.z); scene.add(dap);

  // 客席スツール（3脚）
  const sc = [0x7b4f2e, 0x6b3e1e, 0x8b5e3a];
  for(let i=-1; i<=1; i++){
    const st = mkCyl(0.22, 0.22, 0.42, 16, sc[i+1]);
    st.position.set(i*1.5, 0.21, COUNTER_POS.z+2.1); scene.add(st);
    const se = mkCyl(0.26, 0.26, 0.06, 16, 0x4a2800);
    se.position.set(i*1.5, 0.45, COUNTER_POS.z+2.1); scene.add(se);
    const bk = mkBox(0.44, 0.52, 0.06, 0x4a2800);
    bk.position.set(i*1.5, 0.74, COUNTER_POS.z+1.84); scene.add(bk);
  }

  // 店外歩道
  const sw2 = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_W+4, 12),
    new THREE.MeshStandardMaterial({color:0x888890, roughness:0.95})
  );
  sw2.rotation.x = -Math.PI/2; sw2.position.set(0, -0.002, ROOM_D/2+6); scene.add(sw2);
})();

// ================================================================
// 発注PC（青デスク）
// ================================================================
(function buildPC(){

// ================================================================
// お客さん（完全接地修正版）
// ================================================================
/**
 * humanTemplates は必ず「接地済みGroup」として保持する。
 * clone時はcloneしたオブジェクトをそのままシーンに追加し、
 * position.yはworld座標で0にセットする。
 */
function spawnCustomer(){
  if(customers.length >= MAX_CUSTOMERS) return;
  const id = customerIdCounter++;
  const slot = customers.length;
  const targetX = COUNTER_POS.x + (slot-1)*1.5;

  // テンプレートをclone
  let mesh;
  if(humanTemplates[id % 3]){
    mesh = humanTemplates[id % 3].clone();
  } else {
    mesh = makeFallbackHuman(id % 3);
  }
  mesh.castShadow = true;

  // 【接地補正】cloneしたメッシュのバウンディングボックス底面をY=0に
  mesh.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(mesh);
  const bottomY = bb.min.y;
  // bottomYだけ上にずらして接地させる
  mesh.position.set(targetX * 0.2, -bottomY, SPAWN_Z);
  mesh.rotation.y = Math.PI;
  scene.add(mesh);

  const speechEl = document.createElement('div');
  speechEl.className = 'speech-bubble';
  speechEl.textContent = '🚶 入店中...';
  document.body.appendChild(speechEl);

  const c = {
    mesh, state:'walking', timer:0,
    ramenMesh:null, coinMesh:null,
    speechEl, id, targetX, targetZ:CUSTOMER_TZ,
    groundOffset: -bottomY  // 接地オフセットを保持
  };
  customers.push(c);
}

function removeCustomer(c){
  scene.remove(c.mesh);
  if(c.ramenMesh) scene.remove(c.ramenMesh);
  if(c.coinMesh)  scene.remove(c.coinMesh);
  if(c.speechEl)  c.speechEl.remove();
  customers = customers.filter(x => x !== c);
}

// ================================================================
// ラーメン生成（カウンター用）
// ================================================================
function makeRamenForCounter(x, y, z){
  let ramen;
  if(ramenTemplate){
    ramen = ramenTemplate.clone();
    const bb = new THREE.Box3().setFromObject(ramen);
    const sz = new THREE.Vector3(); bb.getSize(sz);
    const maxD = Math.max(sz.x, sz.z);
    const sc = maxD > 0 ? 0.32/maxD : 1;
    ramen.scale.set(sc, sc, sc);
    const bb2 = new THREE.Box3().setFromObject(ramen);
    ramen.position.set(x, y-bb2.min.y, z);
  } else {
    ramen = makeFallbackRamen();
    ramen.position.set(x, y, z);
  }
  return ramen;
}

// UI更新

function updateUI(){
  document.getElementById('money-val').textContent  = `$${money}`;
  document.getElementById('order-stock').textContent = orderStock;
  document.getElementById('ramen-ready').textContent = readyRamen;
  document.getElementById('carry-text').textContent  =
    handItem === 'empty' ? 'なし' : handItemLabel(handItem);

  const obj = document.getElementById('obj-text');
  const waiting = customers.some(c => c.state === 'waiting');
  const paidC   = customers.some(c => c.state === 'paid');

  if(paidC){ obj.textContent = '💰 カウンター近くで金貨をタップ！(+$30)'; return; }
  if(readyRamen > 0 && waiting){ obj.textContent = '🍜 カウンターをタップ→提供！'; return; }

  switch(cookStep){
    case STEPS.IDLE:
      if(orderStock <= 0) obj.textContent = '🖥️ PCで食材を発注しよう';
      else if(boxes.length > 0) obj.textContent = '📦 配達エリアの箱をタップ→受取';
      else if(waiting) obj.textContent = '🍜 ①麺スペースへ→調理スタート！';
      else obj.textContent = '⏳ お客さんを待とう…';
      break;
    case STEPS.HAVE_RAW:     obj.textContent = '🫕 ②鍋スペースへ→麺を投入！'; break;
    case STEPS.BOILING:      obj.textContent = '⏳ 茹で中… 3秒待とう'; break;
    case STEPS.BOILED_WAIT:  obj.textContent = '🥢 ②鍋スペースをタップ→麺を上げる'; break;
    case STEPS.YUKIRI_WAIT:  obj.textContent = '💦 湯切りボタンを3回連打！'; break;
    case STEPS.NOODLE_READY: obj.textContent = '🥣 カウンターへ→空の丼を取る'; break;
    case STEPS.HAVE_BOWL:    obj.textContent = '🍵 ②鍋スペースへ→スープを注ぐ'; break;
    case STEPS.BOWL_SOUP:    obj.textContent = '🍜 ②鍋スペース再タップ→麺を投入'; break;
    case STEPS.BOWL_NOODLE:  obj.textContent = '🌿 ④ネギスペースへ→ネギを乗せる'; break;
    case STEPS.BOWL_NEGI:    obj.textContent = '🥩 ③チャーシュースペースへ→乗せる'; break;
    case STEPS.RAMEN_COMPLETE: obj.textContent = '✅ カウンターをタップ→完成提供！'; break;
    default: obj.textContent = ''; break;
  }
}

function handItemLabel(t){

    bowl_empty:'空の丼', bowl_soup:'スープ入り丼',
    bowl_soup_noodle:'麺＋スープ丼', bowl_negi:'ネギ乗せ丼',
    bowl_all:'完成ラーメン！'
  };
  return M[t] || t;
}

function doOrder(){
  const cost = 30 * orderQty;
  if(money < cost){ showToast('💸 お金が足りません！'); return; }
  money -= cost;
  orderStock += orderQty;
  closeOrderModal();
  for(let i=0; i<orderQty; i++) spawnDeliveryBox();
  showToast(`📦 ${orderQty}セット発注！配達エリアへ届きます`);
  updateUI();
}
window.doOrder = doOrder;

window.doYukiri = function(){
  if(cookStep !== STEPS.YUKIRI_WAIT) return;
  yukiriLeft--;
  document.getElementById('yukiri-count').textContent = yukiriLeft;
  // 画面揺れ
  document.body.classList.remove('shaking');
  void document.body.offsetWidth;
  document.body.classList.add('shaking');
  showToast('シャッシャッ！', 600);
  if(yukiriLeft <= 0){
    cookStep  = STEPS.NOODLE_READY;
    yukiriLeft = 3;
    document.getElementById('yukiri-btn').style.display = 'none';
    setHandItem('boiled_noodle');
    showToast('✅ 麺の湯切り完了！丼を取りに行こう', 2500);
    updateCookingUI();
    updateUI();
  }
};

// ================================================================
// アクション判定（調理ステートマシン）
// ================================================================
let actionCD = 0;

function doAction(){
  if(!gameRunning || actionCD > 0) return;
  actionCD = 280;
  const flat = new THREE.Vector3(playerPos.x, 0, playerPos.z);

  // コイン受取（最優先）
  const paidC = customers.find(c => c.coinMesh && c.state === 'paid');
  if(paidC){
    const ctD = flat.distanceTo(new THREE.Vector3(COUNTER_POS.x, 0, COUNTER_POS.z));
    if(ctD < 3.2){
      money += 30; customersServed++;
      scene.remove(paidC.coinMesh); paidC.coinMesh = null;
      showToast('💰 +$30 ありがとう！');
      removeCustomer(paidC);
      updateUI(); return;
    }
  }

  // PC発注
  const pcD = flat.distanceTo(new THREE.Vector3(PC_POS.x, 0, PC_POS.z));
  if(pcD < 3.0){ openOrderModal(); return; }

  // 配達箱を拾う
  if(boxes.length > 0 && handItem === 'empty' && cookStep === STEPS.IDLE){
    let best = null, bestD = 2.8;
    boxes.forEach(b=>{
      const d = flat.distanceTo(new THREE.Vector3(b.mesh.position.x, 0, b.mesh.position.z));
      if(d < bestD){ bestD = d; best = b; }
    });
    if(best){
      scene.remove(best.mesh);
      boxes = boxes.filter(b => b !== best);
      showToast('📦 食材セットを受け取った！①麺スペースへ');
      updateUI(); return;
    }
  }

  // 各スペースとの距離
  const nd  = flat.distanceTo(new THREE.Vector3(NOODLE_SPACE.x, 0, NOODLE_SPACE.z));
  const pd  = flat.distanceTo(new THREE.Vector3(POT_SPACE.x,   0, POT_SPACE.z));
  const cd  = flat.distanceTo(new THREE.Vector3(CHASHU_SPACE.x,0, CHASHU_SPACE.z));
  const gd  = flat.distanceTo(new THREE.Vector3(NEGI_SPACE.x,  0, NEGI_SPACE.z));
  const ctD = flat.distanceTo(new THREE.Vector3(COUNTER_POS.x, 0, COUNTER_POS.z));

  // 調理ステートマシン
  switch(cookStep){

    // 手順1-a: 麺スペースで生麺を掴む
    case STEPS.IDLE:
      if(nd < 2.6 && orderStock > 0){
        orderStock--;
        cookStep = STEPS.HAVE_RAW;
        setHandItem('raw_noodle');
        showToast('🍜 生麺を掴んだ！②鍋スペースへ');
        updateUI(); return;
      }
      // 完成ラーメンをカウンターで提供
      if(readyRamen > 0 && ctD < 3.2){
        const wc = customers.find(c => c.state === 'waiting');
        if(wc){
          readyRamen--;
          const rx = wc.targetX;
          const ramen = makeRamenForCounter(rx, 0.97, COUNTER_POS.z-0.10);
          scene.add(ramen); wc.ramenMesh = ramen; wc.state = 'eating';
          if(wc.speechEl) wc.speechEl.textContent = '😋 いただきます！';
          showToast('🍜 ラーメンを提供！');
          setTimeout(()=>{
            if(!wc.coinMesh){
              const coin = makeCoin(rx, 1.07, COUNTER_POS.z-0.20);
              scene.add(coin); wc.coinMesh = coin; wc.state = 'paid';
              if(wc.ramenMesh){ scene.remove(wc.ramenMesh); wc.ramenMesh = null; }
              if(wc.speechEl) wc.speechEl.textContent = '💰 ありがとう！';
              showToast('💰 コインをタップして受け取ろう！');
            }
          }, 2800);
          updateUI(); return;
        }
      }
      break;

    // 手順1-b: 鍋スペースで麺投入
    case STEPS.HAVE_RAW:
      if(pd < 3.0){
        cookStep  = STEPS.BOILING;
        isBoiling = true;
        boilTimer = 3.0;
        setHandItem('empty');
        showToast('⏳ 麺を投入！3秒茹でます…');
        updateCookingUI(); updateUI(); return;
      }
      break;

    // 手順1-c: 茹で完了→麺を上げる
    case STEPS.BOILED_WAIT:
      if(pd < 3.0){
        cookStep   = STEPS.YUKIRI_WAIT;
        setHandItem('boiled_noodle');
        yukiriLeft = 3;
        showToast('💦 湯切りボタンを3回連打！');
        updateCookingUI(); updateUI(); return;
      }
      break;

    // 手順2-a: カウンターで空の丼を取る
    case STEPS.NOODLE_READY:
      if(ctD < 3.2){
        cookStep = STEPS.HAVE_BOWL;
        setHandItem('bowl_empty');
        showToast('🥣 空の丼を取った！②鍋スペースへ');
        updateUI(); return;
      }
      break;

    // 手順2-b: 鍋スペースでスープを注ぐ
    case STEPS.HAVE_BOWL:
      if(pd < 3.0){
        cookStep = STEPS.BOWL_SOUP;
        setHandItem('bowl_soup');
        showToast('🍵 スープを注いだ！もう一度②鍋タップ→麺を投入');
        updateUI(); return;
      }
      break;

    // 手順2-c: 再び鍋スペースで麺を投入
    case STEPS.BOWL_SOUP:
      if(pd < 3.0){
        cookStep = STEPS.BOWL_NOODLE;
        setHandItem('bowl_soup_noodle');
        showToast('🍜 麺を投入！④ネギスペースへ');
        updateUI(); return;
      }
      break;

    // 手順3-a: ネギスペースでネギ
    case STEPS.BOWL_NOODLE:
      if(gd < 2.6){
        cookStep = STEPS.BOWL_NEGI;
        setHandItem('bowl_negi');
        showToast('🌿 ネギを乗せた！③チャーシュースペースへ');
        updateUI(); return;
      }
      break;

    // 手順3-b: チャーシュースペースでチャーシュー
    case STEPS.BOWL_NEGI:
      if(cd < 2.6){
        cookStep = STEPS.RAMEN_COMPLETE;
        setHandItem('bowl_all');
        showToast('✅ ラーメン完成！カウンターをタップ');
        updateUI(); return;
      }
      break;

    // 完成→カウンターへ置く
    case STEPS.RAMEN_COMPLETE:
      if(ctD < 3.2){
        readyRamen++;
        cookStep = STEPS.IDLE;
        setHandItem('empty');
        showToast('🍜 ラーメンをカウンターに置いた！提供準備完了');
        updateUI(); return;
      }
      break;
  }
}

function updateActionPrompt(){
  const el  = document.getElementById('action-prompt');
  const flat = new THREE.Vector3(playerPos.x, 0, playerPos.z);
  const pcD = flat.distanceTo(new THREE.Vector3(PC_POS.x, 0, PC_POS.z));
  const nd  = flat.distanceTo(new THREE.Vector3(NOODLE_SPACE.x, 0, NOODLE_SPACE.z));
  const pd  = flat.distanceTo(new THREE.Vector3(POT_SPACE.x, 0, POT_SPACE.z));
  const cd  = flat.distanceTo(new THREE.Vector3(CHASHU_SPACE.x, 0, CHASHU_SPACE.z));
  const gd  = flat.distanceTo(new THREE.Vector3(NEGI_SPACE.x, 0, NEGI_SPACE.z));
  const ctD = flat.distanceTo(new THREE.Vector3(COUNTER_POS.x, 0, COUNTER_POS.z));
  let bdist = 99;
  boxes.forEach(b => bdist = Math.min(bdist, flat.distanceTo(new THREE.Vector3(b.mesh.position.x, 0, b.mesh.position.z))));
  const hasPaid = customers.some(c => c.coinMesh && c.state === 'paid');
  const hasWait = customers.some(c => c.state === 'waiting');

  let msg = null;
  if(hasPaid && ctD < 3.2)    msg = '💰 タップ → お金を受け取る(+$30)';
  else if(pcD < 3.0)          msg = '🖥️ タップ → 仕入れシステムを開く';
  else if(bdist < 2.8 && cookStep === STEPS.IDLE) msg = '📦 タップ → 食材を受け取る';
  else {
    switch(cookStep){
      case STEPS.IDLE:
        if(nd < 2.6 && orderStock > 0) msg = '🍜 タップ → 生麺を掴む';
        else if(readyRamen > 0 && ctD < 3.2 && hasWait) msg = '🍜 タップ → ラーメンを提供';
        break;
      case STEPS.HAVE_RAW:      if(pd < 3.0) msg = '🫕 タップ → 麺を鍋に投入'; break;
      case STEPS.BOILED_WAIT:   if(pd < 3.0) msg = '🥢 タップ → 麺を上げる';   break;
      case STEPS.NOODLE_READY:  if(ctD < 3.2) msg = '🥣 タップ → 空の丼を取る'; break;
      case STEPS.HAVE_BOWL:     if(pd < 3.0) msg = '🍵 タップ → スープを注ぐ'; break;
      case STEPS.BOWL_SOUP:     if(pd < 3.0) msg = '🍜 タップ → 麺を投入';    break;
      case STEPS.BOWL_NOODLE:   if(gd < 2.6) msg = '🌿 タップ → ネギを乗せる'; break;
      case STEPS.BOWL_NEGI:     if(cd < 2.6) msg = '🥩 タップ → チャーシューを乗せる'; break;
      case STEPS.RAMEN_COMPLETE:if(ctD < 3.2) msg = '✅ タップ → カウンターに置く'; break;
    }
  }
  if(msg){ el.textContent = msg; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

const playerPos = new THREE.Vector3(0, 1.65, 3.5);
let yaw   = Math.PI;  // 初期向き：-Z方向（奥）
let pitch = 0;

// ================================================================
// ジョイスティック
// ================================================================
const jsZone  = document.getElementById('joystick-zone');
const jsThumb = document.getElementById('joystick-thumb');
let jsTouchId = null;
const jsVec   = new THREE.Vector2(0, 0);
const JS_MAX  = 48;

function jsRect(){ return jsZone.getBoundingClientRect(); }

jsZone.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  jsTouchId = t.identifier;
  updateThumb(t);
}, {passive:false});
jsZone.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === jsTouchId){ updateThumb(t); break; }
  }
}, {passive:false});
['touchend','touchcancel'].forEach(ev=> jsZone.addEventListener(ev, e=>{
  for(const t of e.changedTouches){
    if(t.identifier === jsTouchId){
      jsTouchId = null; jsVec.set(0,0);
      jsThumb.style.transform = 'translate(-50%,-50%)';
      break;
    }
  }
}));
function updateThumb(touch){
  const r  = jsRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = touch.clientX - cx, dy = touch.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if(dist > JS_MAX){ dx *= JS_MAX/dist; dy *= JS_MAX/dist; }
  jsVec.set(dx/JS_MAX, dy/JS_MAX);
  jsThumb.style.transform = `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}

// ================================================================
// 視点スワイプ（右画面）
// ================================================================
let lookId = null, lookLX = 0, lookLY = 0;
const LOOK_SENS = 0.0055;

canvas.addEventListener('touchstart', e=>{
  if(orderModalOpen) return;
  for(const t of e.changedTouches){
    const r   = jsRect();
    const inJS  = t.clientX>=r.left-14 && t.clientX<=r.right+14 &&
                  t.clientY>=r.top-14  && t.clientY<=r.bottom+14;
    const inBtn = t.clientX>=window.innerWidth-110 && t.clientY>=window.innerHeight-110;
    if(!inJS && !inBtn && lookId === null){
      lookId = t.identifier; lookLX = t.clientX; lookLY = t.clientY;
    }
  }
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  if(orderModalOpen) return;
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === lookId){
      yaw   -= (t.clientX - lookLX) * LOOK_SENS;
      pitch -= (t.clientY - lookLY) * LOOK_SENS;
      pitch  = Math.max(-1.1, Math.min(1.1, pitch));
      lookLX = t.clientX; lookLY = t.clientY;
    }
  }
}, {passive:false});
['touchend','touchcancel'].forEach(ev=> canvas.addEventListener(ev, e=>{
  for(const t of e.changedTouches){
    if(t.identifier === lookId){ lookId = null; }
  }
}));

// マウス操作（PC対応）
let mouseDown = false, mouseLX = 0, mouseLY = 0;
canvas.addEventListener('mousedown', e=>{
  if(e.button === 0){ mouseDown = true; mouseLX = e.clientX; mouseLY = e.clientY; }
});
window.addEventListener('mousemove', e=>{
  if(!mouseDown || orderModalOpen) return;
  yaw   -= (e.clientX - mouseLX) * LOOK_SENS * 0.9;
  pitch -= (e.clientY - mouseLY) * LOOK_SENS * 0.9;
  pitch  = Math.max(-1.1, Math.min(1.1, pitch));
  mouseLX = e.clientX; mouseLY = e.clientY;
});
window.addEventListener('mouseup', ()=> mouseDown = false);

// キーボード移動（PC対応）
const keys = {};
window.addEventListener('keydown', e=> keys[e.code] = true);
window.addEventListener('keyup',   e=> keys[e.code] = false);

// ================================================================
// カメラ前方／右方向
// ================================================================
function getCamFwd(){
  return new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    0,
    Math.cos(yaw) * Math.cos(pitch)
  ).normalize();
}
function getCamRight(){
  return new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();
}

// ================================================================
// 吹き出し投影
// ================================================================
const sv = new THREE.Vector3();
function updateSpeechBubbles(){
  customers.forEach(c=>{
    if(!c.speechEl) return;
    sv.set(c.mesh.position.x, c.mesh.position.y + 2.1, c.mesh.position.z);
    sv.project(camera);
    if(sv.z > 1){ c.speechEl.style.display = 'none'; return; }
    c.speechEl.style.display = 'block';
    c.speechEl.style.left = (sv.x * .5 + .5) * window.innerWidth  + 'px';
    c.speechEl.style.top  = (-sv.y * .5 + .5) * window.innerHeight + 'px';
  });
}

// ================================================================
// ゲームループ
// ================================================================
let lastTime = 0, coinBobT = 0;

function animate(ts){
  requestAnimationFrame(animate);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if(!gameRunning) return;

  actionCD      = Math.max(0, actionCD - dt*1000);
  customerTimer += dt * 1000;

  // お客さんスポーン
  if(customerTimer > CUSTOMER_INTERVAL && customers.length < MAX_CUSTOMERS){
    spawnCustomer();
    customerTimer = 0;
  }

  // 茹でタイマー
  if(isBoiling && cookStep === STEPS.BOILING){
    boilTimer -= dt;
    document.getElementById('cooking-ui').textContent = `⏳ 茹で中… ${Math.ceil(boilTimer)}秒`;
    if(boilTimer <= 0){
      isBoiling = false;
      cookStep  = STEPS.BOILED_WAIT;
      updateCookingUI(); updateUI();
      showToast('✅ 茹で上がり！②鍋をタップして麺を上げよう', 2500);
    }
  }

  // ================================================================
  // 【完全修正】移動処理
  // ジョイスティック:
  //   jsVec.y = -1（上） → 前進（fwd方向）
  //   jsVec.y = +1（下） → 後退（-fwd方向）
  //   jsVec.x = -1（左） → 左（-right方向）
  //   jsVec.x = +1（右） → 右（+right方向）
  // ================================================================
  const speed = 4.8;
  const fwd   = getCamFwd();
  const right = getCamRight();
  const move  = new THREE.Vector3(0, 0, 0);

  // タッチジョイスティック入力
  if(!orderModalOpen && (jsVec.x !== 0 || jsVec.y !== 0)){
    // jsVec.y: 上=-1→前進（-jsVec.y * fwd = +fwd方向）
    move.addScaledVector(fwd,  -jsVec.y * speed * dt);
    move.addScaledVector(right, jsVec.x * speed * dt);
  }

  // キーボード入力（PCサポート）
  if(!orderModalOpen){
    if(keys['ArrowUp']    || keys['KeyW']) move.addScaledVector(fwd,  speed * dt);
    if(keys['ArrowDown']  || keys['KeyS']) move.addScaledVector(fwd, -speed * dt);
    if(keys['ArrowLeft']  || keys['KeyA']) move.addScaledVector(right,-speed * dt);
    if(keys['ArrowRight'] || keys['KeyD']) move.addScaledVector(right, speed * dt);
  }

  if(move.lengthSq() > 0){
    playerPos.add(move);
    playerPos.x = Math.max(BOUNDS.xMin, Math.min(BOUNDS.xMax, playerPos.x));
    playerPos.z = Math.max(BOUNDS.zMin, Math.min(BOUNDS.zMax, playerPos.z));
  }

  // カメラ更新
  camera.position.copy(playerPos);
  camera.lookAt(
    playerPos.x + Math.sin(yaw) * Math.cos(pitch) * 10,
    playerPos.y + Math.sin(pitch) * 10,
    playerPos.z + Math.cos(yaw)  * Math.cos(pitch) * 10
  );

  // 手持ちメッシュ追従
  if(handMesh){
    const f = getCamFwd(), r = getCamRight();
    handMesh.position.set(
      playerPos.x + f.x*0.72 + r.x*0.38,
      playerPos.y - 0.70,
      playerPos.z + f.z*0.72 + r.z*0.38
    );
    handMesh.rotation.y += dt * 0.85;
  }

  // お客さん歩行AI（接地維持）
  customers.forEach(c=>{
    if(c.state !== 'walking') return;
    const dx   = c.targetX - c.mesh.position.x;
    const dz   = c.targetZ - c.mesh.position.z;
    const dist = Math.hypot(dx, dz);
    const ws   = 2.2;
    if(dist > 0.10){
      c.mesh.position.x += (dx/dist) * ws * dt;
      c.mesh.position.z += (dz/dist) * ws * dt;
      // 【接地固定】Y座標はgroundOffsetのまま固定（揺れなし）
      c.mesh.position.y  = c.groundOffset || 0;
      c.mesh.rotation.y  = Math.atan2(dx, dz) + Math.PI;
    } else {
      c.mesh.position.set(c.targetX, c.groundOffset || 0, c.targetZ);
      c.mesh.rotation.y = Math.PI;
      c.state = 'waiting';
      if(c.speechEl) c.speechEl.textContent = '🍜 ラーメン1杯！';
    }
  });

  // コインボブ
  coinBobT += dt;
  customers.forEach(c=>{
    if(c.coinMesh){
      c.coinMesh.position.y = 1.07 + Math.sin(coinBobT * 3.0) * 0.055;
      c.coinMesh.rotation.y += dt * 2.3;
    }
  });

  updateActionPrompt();
  updateSpeechBubbles();
  updateUI();
  updateCookingUI();
  renderer.render(scene, camera);
}

function restartGame(){
  money = 200; orderStock = 0; readyRamen = 0;
  cookStep = STEPS.IDLE; handItem = 'empty';
  if(handMesh){ scene.remove(handMesh); handMesh = null; }
  customers.forEach(c=>{ scene.remove(c.mesh); if(c.speechEl) c.speechEl.remove(); });
  customers = [];
  boxes.forEach(b=> scene.remove(b.mesh)); boxes = [];
  customersServed = 0; customerTimer = 0; gameRunning = true;
  document.getElementById('overlay-msg').classList.remove('active');
  updateUI();
}
window.restartGame = restartGame;

function setProgress(p, msg){
  document.getElementById('loading-bar').style.width = (p*100) + '%';
  document.getElementById('loading-msg').textContent = msg;
}

function startGame(){
  document.getElementById('loading-screen').style.display = 'none';
  updateUI();
  setTimeout(()=>{
    spawnCustomer();
    showToast('🎮 開店！まず🖥️PCで食材を発注しよう', 3500);
  }, 1000);
  animate(0);
}

function loadGLTFLoaderScript(cb){
  const s = document.createElement('script');
  s.src    = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
  s.onload = ()=> cb(null);
  s.onerror= ()=> cb(new Error('failed'));
  document.head.appendChild(s);
}

function tryLoadModel(loader, url, onOk, onFail){
  try {
    loader.load(url, gltf=> onOk(gltf),
      xhr=>{ if(xhr.total) setProgress(xhr.loaded/xhr.total*0.2, `${url}…`); },
      err=> onFail(err)
    );
  } catch(e){ onFail(e); }
}

/**
 * 人モデルの正規化（接地＋スケーリング）
 * - 高さを1.72mに統一
 * - バウンディングボックスの底面(min.y)がY=0になるようGroupでオフセット補正
 * - clone()後もposition.yがそのまま使えるよう、ラッパーGroupに格納
 */
function normalizeHuman(scene3D){
  // 1) スケール計算（高さ1.72mに統一）
  scene3D.updateMatrixWorld(true);
  let bb = new THREE.Box3().setFromObject(scene3D);
  let sz = new THREE.Vector3(); bb.getSize(sz);
  const sc = sz.y > 0.01 ? 1.72 / sz.y : 1.0;
  scene3D.scale.setScalar(sc);

  // 2) スケール適用後に再計算して接地
  scene3D.updateMatrixWorld(true);
  bb = new THREE.Box3().setFromObject(scene3D);
  // 底面をY=0にするため、内部を上方向にオフセット
  scene3D.position.y = -bb.min.y;

  // 3) Groupでラップ（cloneしても接地状態が維持される）
  const wrapper = new THREE.Group();
  wrapper.add(scene3D);
  // wrapperそのものの位置は(0,0,0)のまま
  return wrapper;
}

// ロード開始
setProgress(0, 'GLTFLoaderを取得中...');
loadGLTFLoaderScript(err=>{
  if(err || typeof THREE.GLTFLoader === 'undefined'){
    setProgress(1, 'フォールバック形状を使用');
    humanTemplates = [0,1,2].map(i => makeFallbackHuman(i));
    setTimeout(startGame, 500);
    return;
  }

  const loader = new THREE.GLTFLoader();
  let loaded = 0;
  const total = 4;
  function oneDone(){
    loaded++;
    setProgress(loaded/total, `モデル読み込み (${loaded}/${total})`);
    if(loaded >= total) startGame();
  }

  setProgress(0.04, 'ramen.glbを読み込み中...');
  tryLoadModel(loader, './ramen.glb',
    gltf=>{ ramenTemplate = gltf.scene; oneDone(); },
    _=>{ oneDone(); }
  );
  tryLoadModel(loader, './human1.glb',
    gltf=>{ humanTemplates[0] = normalizeHuman(gltf.scene); oneDone(); },
    _=>{ humanTemplates[0] = makeFallbackHuman(0); oneDone(); }
  );
  tryLoadModel(loader, './human2.glb',
    gltf=>{ humanTemplates[1] = normalizeHuman(gltf.scene); oneDone(); },
    _=>{ humanTemplates[1] = makeFallbackHuman(1); oneDone(); }
  );
  tryLoadModel(loader, './human3.glb',
    gltf=>{ humanTemplates[2] = normalizeHuman(gltf.scene); oneDone(); },
    _=>{ humanTemplates[2] = makeFallbackHuman(2); oneDone(); }
  );
});
</script>
